<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAR+ING | POP-UP</title><link rel="stylesheet" href="style.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0d1d}
.shell-header{position:fixed;z-index:1000;top:0;left:0;right:0;height:72px;background:#090d1b;border-bottom:1px solid #29304b}
.shell-nav{height:100%;max-width:1160px;margin:auto;display:flex;align-items:center;gap:26px;padding:0 20px}
.shell-brand{color:white;font-size:24px;font-weight:900;letter-spacing:1px;text-decoration:none;white-space:nowrap}.shell-brand span{color:#ff3e81}
.shell-links{display:flex;align-items:center;gap:24px;margin-left:auto}.shell-links button{border:0;background:transparent;color:#d6dbec;font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap;padding:9px 0}.shell-links button.active,.shell-links button:hover{color:#ff4185}
.shell-tools{display:flex;align-items:center;gap:8px;padding-left:18px;border-left:1px solid #333b57}
.social-btn{width:35px;height:35px;border:1px solid #38405f;border-radius:10px;background:#171d33;color:white;cursor:pointer;display:grid;place-items:center;text-decoration:none;font-weight:900;font-size:17px}.social-btn:hover{border-color:#ff4185;background:#273050}
.lang{background:#171d33;color:#fff;border:1px solid #38405f;border-radius:9px;padding:8px 6px;cursor:pointer}
#contentFrame{position:fixed;top:72px;left:0;width:100%;height:calc(100% - 72px);border:0;background:#0a0d1d}
.shell-toast{display:none;position:fixed;z-index:1100;right:20px;top:84px;background:#222a46;color:#fff;border:1px solid #485277;padding:12px 18px;border-radius:10px;box-shadow:0 10px 28px #0008}
@media(max-width:900px){.shell-nav{gap:10px}.shell-links{gap:10px}.shell-links button{font-size:12px}.shell-tools{padding-left:8px;gap:5px}.social-btn{width:30px;height:30px}}
@media(max-width:650px){.shell-header{height:105px}.shell-nav{flex-wrap:wrap;justify-content:space-between;align-content:center;gap:7px}.shell-links{order:3;width:100%;justify-content:space-between;margin:0}.shell-tools{margin-left:auto}#contentFrame{top:105px;height:calc(100% - 105px)}}
</style></head><body>
<header class="shell-header"><nav class="shell-nav" aria-label="주 메뉴">
<a class="shell-brand" href="#home" id="brand">STAR<span>+ING</span></a>
<div class="shell-links">
<button data-page="home.html" data-ko="홈" data-en="HOME">홈</button>
<button data-page="about.html" data-ko="팝업스토어 소개" data-en="ABOUT">팝업스토어 소개</button>
<button data-page="events.html" data-ko="이벤트 안내" data-en="EVENTS">이벤트 안내</button>
<button data-page="worldcup.html" data-ko="미니게임" data-en="MINI GAME">미니게임</button>
</div>
<div class="shell-tools">
<button class="social-btn" data-social="X" title="X 공식 계정 (연결 주소 설정 필요)" aria-label="X">𝕏</button>
<button class="social-btn" data-social="Instagram" title="인스타그램 공식 계정 (연결 주소 설정 필요)" aria-label="Instagram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"/></svg></button>
<button class="social-btn" data-social="YouTube" title="유튜브 공식 채널 (연결 주소 설정 필요)" aria-label="YouTube"><svg width="19" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/></svg></button>
<select class="lang" id="language" aria-label="언어 선택"><option value="ko">한국어</option><option value="en">English</option></select>
</div></nav></header>
<iframe id="contentFrame" name="contentFrame" src="home.html" title="STAR+ING 콘텐츠"></iframe>
<div class="shell-toast" id="shellToast" role="status"></div>
<script>
// 실제 공식 계정 URL이 확정되면 아래 세 값만 교체하세요.
const SOCIAL_URLS={X:'',Instagram:'',YouTube:''};
const pages=new Set(['home.html','about.html','events.html','worldcup.html','collection.html','guide.html','notice.html']);
const frame=document.getElementById('contentFrame');
const buttons=[...document.querySelectorAll('[data-page]')];
function go(page){if(!pages.has(page))return;frame.src=page;setActive(page);location.hash=page.replace('.html','')}
function setActive(page){buttons.forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
buttons.forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('brand').addEventListener('click',e=>{e.preventDefault();go('home.html')});
let toastTimer;function toast(s){const t=document.getElementById('shellToast');t.textContent=s;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',3200)}
document.querySelectorAll('[data-social]').forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.social,url=SOCIAL_URLS[name];if(url)window.open(url,'_blank','noopener,noreferrer');else toast(name+' 공식 채널 URL은 추후 연결 예정입니다.')}));
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==='staring-page'){const p=e.data.page;if(pages.has(p)){setActive(p);history.replaceState(null,'','#'+p.replace('.html',''))}}});
// 현재 시연용 언어 전환은 공통 메뉴와 주요 페이지 제목/문구를 번역합니다.
const translatePairs={
'카드 이상형 월드컵':'Card World Cup','참여할 SUPERSTAR 시리즈를 선택하세요.':'Choose a SUPERSTAR series.','현장 이벤트':'On-site Events','공간에서 이어지는 팬 참여 프로그램 (시연용 기획안).':'Interactive fan activities (demo).','POP-UP STORE':'POP-UP STORE','팝업스토어 소개':'About the Pop-up','공지사항':'Notices','행사 일정 및 장소':'Event Schedule & Location','FAQ · 자주 묻는 질문':'FAQ','카드 갤러리':'Card Gallery','플레이존 & 스탬프 미션':'Play Zone & Stamp Mission','직원 카드 교환':'Staff Card Exchange','게임 메인화면으로 돌아가기':'Back to Game Home','시리즈 선택으로 돌아가기':'Back to Series','내가 선택한 우승 카드':'My Winning Card','다른 참가자의 선택 TOP 3':'Community Top 3'
};
function applyLanguage(){const lang=document.getElementById('language').value;buttons.forEach(b=>b.textContent=b.dataset[lang]);document.documentElement.lang=lang;try{const doc=frame.contentDocument;if(!doc)return;const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);while(walker.nextNode()){const node=walker.currentNode;if(node.parentElement.closest('script,style'))continue;if(node.__originalText===undefined)node.__originalText=node.nodeValue;const original=node.__originalText;if(lang==='ko'){node.nodeValue=original;continue}let value=original;for(const [ko,en] of Object.entries(translatePairs))value=value.replaceAll(ko,en);node.nodeValue=value}}catch(e){}}
document.getElementById('language').addEventListener('change',applyLanguage);
frame.addEventListener('load',applyLanguage);
const initial=location.hash.slice(1);if(initial&&pages.has(initial+'.html'))go(initial+'.html');else setActive('home.html');
</script></body></html>
